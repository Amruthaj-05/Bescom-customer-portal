<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BESCOM CUSTOMER PORTAL</title><style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
    }
    .container {
  max-width: 500px;
  margin: 150px auto;
  background: #fffffe;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
  text-align: center;
}

input, button {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  background-color: #007BFF;
  color: white;
  border: none;
}

button:hover {
  background-color: #0056b3;
}

a {
  color: #007BFF;
  text-decoration: none;
}
    .navbar {
      background-color: #003366;
      color: white;
      display: flex;
      justify-content: space-between;
      padding: 15px 30px;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links li a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      transition: background 0.3s;
    }

    .nav-links li a:hover,
    .nav-links li a.active {
      background-color: #00509e;
      border-radius: 5px;
    }

    .hero {
      background: url('https://images.unsplash.com/photo-1604079621443-4bd2f03bb18e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover;
      height: 70vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero-content {
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 10px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .btn {
      background-color: #ffaa00;
      color: black;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #e69500;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 50px 20px;
      background-color: #ffffff;
      flex-wrap: wrap;
    }

    .feature-box {
      background-color: #e6f0ff;
      border-left: 5px solid #003366;
      padding: 20px;
      max-width: 300px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .feature-box:hover {
      transform: translateY(-5px);
    }
    html, body {
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
}

main {
  flex: 1;
}

    .feature-box h3 {
      margin-bottom: 10px;
      color: #003366;
    }

    .feature-box p {
      font-size: 1rem;
      color: #333;
    }
    body {
  background: url('/static/project.jpg') no-repeat center center fixed;
  background-size: cover;
}
    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 15px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <div class="logo">⚡ BESCOM</div>
      <ul class="nav-links">
        <li><a href="/home">Home</a></li> 
       <li><a href="/index"class=active>Login</a></li>
        <li><a href="/help">Help</a></li>
        <li><a href="/aboutus">About Us</a></li>
        </ul>
      </div>
  </header>
  <main>
    <div class="container">
        <h2>Customer Id {{ customer_id }} not found</h2>
        <a href="/update">Try again</a>
    </div>
  </main>
</body>
</html>
